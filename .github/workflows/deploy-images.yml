# 档位二：push main（发版）→ GitHub 的 16G 构建机自动构建双镜像 → 推 ghcr.io。
# 服务器从此只拉不建：docker compose -f docker-compose.prod.yml pull && up -d
# （8G 小机在生产机上构建会内存打穿——2026-07-16 实测 26 分钟 + OOM，此为根治）
#
# 镜像地址（公开仓库默认包也公开，服务器无需登录即可拉取；若包被设为私有，
# 服务器先 docker login ghcr.io -u <用户名> -p <PAT>）：
#   ghcr.io/xiaojilele-glitch/whybuddy-app:latest      （及 :<commit-sha> 可回滚）
#   ghcr.io/xiaojilele-glitch/whybuddy-python:latest
#   ghcr.io/xiaojilele-glitch/whybuddy-project-preview:latest   （预览网关，docker-compose.project.yml）
#
# ⚠ 2026-10-09：预览网关原来不在这里，只在 docker-compose.project.yml 里写 `build:` 现场构建。服务器照「只拉
#   不建」部署，pull 拉不到它、up -d 看到本地旧镜像也不重建——网关修复（d387037）推上去一整天，线上容器还是
#   3 周前那版，`/app/gateway.cjs` 里一处新代码都没有。三个服务现在都从这里出镜像，部署一条 pull 全更新。
name: deploy-images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    # 双推开关：仓库配了 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets 时，
    # 镜像同时推 Docker Hub（docker.io/<用户名>/whybuddy-*）——国内服务器
    # 走 Docker Hub 加速源拉取，绕开 ghcr 直连超时。没配则只推 ghcr。
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            # 这些路径变了，前端镜像的内容不会变（Dockerfile.dockerignore 里多排掉的那几条，两边一致，判据钉着）；
            # 例外：kept_paths 在排掉的目录里，但前端编译要读（两边共用的数据），它变了照样算前端变了。
            unchanged_paths: "slide-rule-python docs/**/*.md"
            kept_paths: "slide-rule-python/services/data"
          - name: python
            dockerfile: slide-rule-python/Dockerfile
          - name: project-preview
            dockerfile: server/project-preview/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # 算版本号要看历史（下面 release 那步）。blob:none 只拉提交和目录树，不拉旧文件内容，几乎不多花时间。
          fetch-depth: 0
          filter: blob:none

      # ⚠ 2026-10-09 CI 日志（run 660）：GIT_SHA 原来传 github.sha，每次提交都变，前端镜像里用到它的那步（编译）
      #   就每次重跑——只改了 Python 的提交也重编前端 81 秒。版本号改成「这个镜像的内容最后一次变化的那个提交」：
      #   内容没变，版本号不变，整层走缓存；Sentry 里前端的报错照样对得上是哪一版前端代码。
      #   unchanged_paths 为空（python / 预览网关）就是 github.sha，跟原来一样。
      - id: release
        run: |
          SHA='${{ github.sha }}'
          if [ -n '${{ matrix.unchanged_paths }}' ]; then
            set -f
            EXCLUDES=""
            for p in ${{ matrix.unchanged_paths }}; do EXCLUDES="$EXCLUDES :(exclude,glob)$p"; done
            FOUND=$(git log -1 --format=%H HEAD -- . $EXCLUDES)
            # git 的 exclude 压过正向路径，例外得单独查一次，再取两者里较新的那个。
            if [ -n '${{ matrix.kept_paths }}' ]; then
              KEPT=$(git log -1 --format=%H HEAD -- ${{ matrix.kept_paths }})
              [ -n "$KEPT" ] && FOUND=$(git rev-list -n1 --topo-order $FOUND $KEPT)
            fi
            SHA=${FOUND:-$SHA}
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "release for ${{ matrix.name }}: ${SHA}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ghcr 仓库名必须全小写；github.repository 带大写（WhyBuddy）。
      # tags 在这里拼：ghcr 恒推，Docker Hub 按 secrets 有无追加。
      - id: meta
        run: |
          LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/${LC}-${{ matrix.name }}:latest
          ghcr.io/${LC}-${{ matrix.name }}:${{ github.sha }}"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            TAGS="${TAGS}
          docker.io/${DOCKERHUB_USERNAME}/whybuddy-${{ matrix.name }}:latest
          docker.io/${DOCKERHUB_USERNAME}/whybuddy-${{ matrix.name }}:${{ github.sha }}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "${TAGS}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # ⚠ 工作台 CSP 的 frame-src 在**编译期**定死（见 Dockerfile 里那段注释）。
          #   不传这个，构建出来的包就是 `frame-src 'self'`，私有预览的 iframe
          #   会被浏览器拦掉——而且不报 502，只是「打不开」。
          #   放 repo variable（不是 secret）：它是公开域名，不是凭据。
          #   没配时传空串，CSP 退回只允许本站 iframe，等于旧行为。
          #   python 那个 Dockerfile 不认这个 ARG，多传无害。
          #   错误上报：GIT_SHA 让每条报错对得上是哪一版；VITE_SENTRY_DSN 是浏览器那份（公开的，放 variable）。
          #   GIT_SHA 见上面 release 那步。两个 Dockerfile 都认 GIT_SHA；python 那个不认 VITE_SENTRY_DSN，多传无害。
          build-args: |
            WHYBUDDY_PROJECT_PREVIEW_ORIGIN_TEMPLATE=${{ vars.WHYBUDDY_PROJECT_PREVIEW_ORIGIN_TEMPLATE }}
            GIT_SHA=${{ steps.release.outputs.sha }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
