# 架构清单 —— 依赖要**显式声明**，没声明的边判据当场变红。
#
# 抄 grok-build：他们 91 个 crate 各自在 Cargo.toml 里声明依赖，边上还写着
# 为什么依赖（`# CompactionDetail, embedded in CompactionMode::Segments.`），
# 347 条边全由编译器强制。我们没有那个编译器，这份清单 + tests/test_architecture.py
# 就是它。详见 arch_graph.py 模块头。
#
# ⚠ 改这个文件 = 改架构。加一条 may_depend_on 之前先问：这条依赖是必须的，
#   还是"顺手 import 一下"？后者的代价是下一个人再也分不清哪些边是设计、
#   哪些是历史。

[layer.models]
rank = 0
what = "数据形状"
# 数据模型不依赖任何内部模块——它被所有人依赖，反过来就成环。
may_depend_on = []

[layer.config]
rank = 0
what = "配置"
may_depend_on = []

[layer.sliderule_llm]
rank = 1
what = "LLM 通道"
# 网关要读配置、要用状态模型的形状。
may_depend_on = ["config", "models"]

[layer.services]
rank = 2
what = "业务"
# 业务层调 LLM 通道、读配置、用状态模型。**不许反向依赖 routes/app**。
may_depend_on = ["config", "models", "sliderule_llm"]

[layer.middlewares]
rank = 2
what = "中间件"
# 身份中间件要读配置与用户模型。
#
# ⚠ 2026-08-29 补 services：`current_user` 要 `services.auth_tokens`（验令牌）
#   与 `services.identity_store`（查用户、查停用/撤销）。这不是绕开分层——
#   鉴权本来就要问身份服务，把这两样搬进中间件等于让身份逻辑长出第二份。
#   与 routes 同 rank：两者都是「HTTP 边缘」，都可以调业务，业务不许反过来调它们。
may_depend_on = ["config", "models", "services"]

[layer.routes]
rank = 3
what = "HTTP 路由"
# 路由是薄的：拼装业务、读配置、用中间件鉴权。
may_depend_on = ["config", "models", "services", "sliderule_llm", "middlewares"]

[layer.app]
rank = 4
what = "装配根"
# 对应 grok 的 composition root（xai-grok-pager-bin）：只负责把东西装起来。
may_depend_on = ["config", "models", "routes", "services", "middlewares"]

[layer.scripts]
rank = 5
what = "运维脚本"
# 一次性脚本可以够到任何东西——它不在产品链上，出事也炸不到用户。
may_depend_on = ["config", "models", "services", "routes", "sliderule_llm", "app", "middlewares"]


# ── services 内部分层（抄 grok 的叶子 crate）──────────────────────────────────
#
# grok 把 51 个共用叶子（token 估算、路径、文件工具…）切成独立 crate，依赖方向
# 由编译器焊死：大块能用叶子，叶子永远碰不到大块。我们 195 个 services 模块平铺
# 在一个命名空间里，谁都能 import 谁——这正是「463 条 import 藏在函数体里」的根：
# 放在文件头会循环导入，只好挪进函数体。
#
# ⚠ 这份分层是**从今天的真实依赖深度算出来的**（arch_graph.suggest_services_layers），
#   不是重新设计。它是一条棘轮基线：先把现状固定成契约，此后只许变好。
#   别把它读成「架构本该如此」。
#
# ⚠ 同层之间互相依赖是允许的（util 层实测没有内部边，core/flow 有）。
#   闸只挡**越层向上**：叶子碰上层、core 碰 flow。
#
# ⚠ 新加模块要落进某一层。落不进说明它既不是工具也不是编排——那通常意味着
#   它该被拆成两个。

[services_layer.util]
rank = 0
what = "纯工具：不依赖 services 里任何其它模块"
