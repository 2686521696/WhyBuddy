[component.run_control]
why = """本轮运行的控制面标记：该不该停（取消/暂停）、降级过没有、同一步连着跑了几次。
四个都是零依赖叶子，被引擎、驱动、spec-first 和路由共用。

⚠ 单独成组是**订正一处自打脸的归组**：`run_cancel` 一直在 platform，而它的三个亲兄弟
`run_pause` / `run_degradation` / `repeat_policy` 在 drive——同一件事被拆在两个组，
于是引擎（model_core）为了读一个降级标记，就得反过来依赖驱动组，
`model_core ⇄ drive` 那 21 条边里有 14 条是这么来的。

抄 grok 的小叶子 crate：一件事一个 crate，谁都能依赖它，它谁都不依赖。"""
may_depend_on = ["platform"]
modules = [
  "services.repeat_policy",
  "services.run_cancel",
  "services.run_degradation",
  "services.run_pause",
]

