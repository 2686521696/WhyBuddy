# ── component：crate 级的边界（2026-08-29 抄 grok 的 Cargo.toml）─────────────
#
# grok 有 90 个 crate、347 条**声明过**的依赖边，边界由编译器焊死。我们的模块
# 粒度比 crate 细（270 个文件），所以在这里显式声明「哪几个模块是同一个 crate」，
# 以及「哪个 crate 可以依赖哪个」。
#
# ⚠ 这份归组与 may_depend_on **是从今天的真实依赖算出来的**（棘轮基线），
#   不是重新设计。先把现状固定成契约，此后只许变好。
#
# ⚠ 内部成环默认**红**，要单独 allow_internal_cycles = true 并说明理由。
#   归组的目的是声明依赖，不是给环发通行证。


[component.a2a]
why = """A2A 协议面：Agent-to-Agent 的会话、报告与分析投影。与推演工厂是两个平面，不共用状态。"""
may_depend_on = []
modules = [
  "services.a2a_core_route_cutover",
  "services.a2a_production_transport_ownership_closure",
  "services.a2a_runtime",
  "services.a2a_session_stream_runtime_slice",
]

[component.agent_loop]
why = """Agent Loop 面：事件仓、运行记录、控制目录、心跳。"""
may_depend_on = ["identity", "platform"]
modules = [
  "routes.agent_loop",
  "services.agent_loop_artifacts",
  "services.agent_loop_bridge",
  "services.agent_loop_event_schema",
  "services.agent_loop_event_store",
  "services.agent_loop_events",
