[component.capability_engine]
# ⚠ 全仓唯一 opt-in 允许内部互指的组，理由见 why。
allow_internal_cycles = true
why = """能力执行引擎：slide_rule_executor 是原语与总入口，capability_maps 是能力→实现的映射表。两者互相委托是**有意的**——源码注释写着 structure.decompose 那条分支原本是第二份拷贝，「所以这里改成委托，不再各写一份」。拆开会让同一段逻辑再变成两份，那正是这个仓踩过三次的坑。"""
may_depend_on = ["evidence", "llm_gateway", "platform", "spec_first"]
modules = [
  "services.capability_maps",
  "services.slide_rule_executor",
]

