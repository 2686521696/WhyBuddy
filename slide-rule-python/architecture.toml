why = """最底下的共用叶子：配置、数据形状、请求域上下文、零依赖的契约与工具。
判定标准是**性质不是题材**——它谁都不依赖，所以谁都能安全 import 它。
⚠ 但「零依赖的叶子」≠「该放这里」：全仓 121 个 util 叶子里有 39 个长在别的组且被跨组
依赖，那是**对的**（connectors 属 evidence、auth_tokens 属 identity、audit_sink 属 audit）。
叶子被多个组用是 grok 叶子 crate 的常态，只有**成环**时才是问题。别拿零依赖当搬家理由。"""
