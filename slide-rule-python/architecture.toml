# ── 棘轮基线 ────────────────────────────────────────────────────────────────
#
# 存量违规与环冻在这里，判据只比「有没有变多」。**这份清单只许变短。**
#
# ⚠ 为什么不一次改干净：这些环穿过的是最核心的几对文件
#   （v5_full_driver ⇄ v5_capability_executor 之类）。一次性拆依赖的风险，
#   远大于它能换来的整洁——而风险落在一条跑一次要 20 分钟真钱的链上。
#   想清哪条清哪条，清完从这里删掉。
#
# ⚠ 往这里加东西 = 有意接受一笔新欠账。`--freeze` 会一把全写进来，
#   所以它不该出现在日常流程里；日常应该是让判据红，然后**改代码**。
[baseline]
violations = [
]
services_violations = [
]
component_violations = [
]
# ⚠ 组间的环。2026-08-29 第一次量到 17 个，一路还到 2 个：
#     17 → 13（归组规则打架 + SQL 网关埋错地方）
#     13 → 8 （语义陷阱：identity 在这仓里有两个意思）
#     8  → 6 （契约和闸放回该在的位置）
#     6  → 5 （装配根不许被业务层 import：探针改成装配根自己钉标记）
#     5  → 2 （请求域上下文切成叶子 turn_context：宪章 / 连接器 / 技能三块
#             prompt 上下文原本长在 drive 和 model_core 里，谁要拼就得反过来
#             import 上层，一条边连着三个环）
#     2  → 1 （refine 并进 spec_first：它三个模块的唯一 import 方就是
#             spec_first_pipeline，同时又回读这条流水线自己的校验器——
#             按 grok 的口径这是同一个 crate 内部的模块互指，不是两个 crate。
#             ⚠ 我先前拒绝过这次合并，理由是"有 8 个消费者散在三个组"，
#             那个数字是裸 grep 数出来的，依赖图里只有 1 个。见 §29）
#   模块级的环早已清零，组级还剩这两个——不矛盾：**粒度不同看到的东西不同**。
#   **只许变少。** 剩下这两个都不是"挪个文件"能了的，见
#   docs/欠缺模块清单-对照Claude与Grok-build.md §23。
component_cycles = [
]
cycles = [
]
# ⚠ 没人 import 的模块。**这不是待删清单**——实测这批里绝大多数是三类
