# ── 棘轮基线 ────────────────────────────────────────────────────────────────
#
# 存量违规与环冻在这里，判据只比「有没有变多」。**这份清单只许变短。**
#
# ⚠ 为什么不一次改干净：这些环穿过的是最核心的几对文件
#   （v5_full_driver ⇄ v5_capability_executor 之类）。一次性拆依赖的风险，
#   远大于它能换来的整洁——而风险落在一条跑一次要 20 分钟真钱的链上。
#   想清哪条清哪条，清完从这里删掉。
#
# ⚠ 往这里加东西 = 有意接受一笔新欠账。`--freeze` 会一把全写进来，
#   所以它不该出现在日常流程里；日常应该是让判据红，然后**改代码**。
[baseline]
violations = [
  "middlewares -> services",
  "services -> app",
  "sliderule_llm -> services",
]
services_violations = [
]
cycles = [
  "services.capability_maps -> services.slide_rule_executor -> services.capability_maps",
  "services.v5_capability_executor -> services.v5_full_driver -> services.v5_capability_executor",
]
