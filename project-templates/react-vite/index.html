    <script>/* WhyBuddy 预览：应用脚本跑起来前先接住报错，/_whybuddy/editor.js 装好后补报（Sentry Loader 的先排队后回放）。 */window.__whybuddyEarlyErrors=[];addEventListener("error",function(e){var q=window.__whybuddyEarlyErrors;if(e instanceof ErrorEvent&&q.length<10)q.push(["uncaught_exception",(e.error&&e.error.message)||e.message,(e.error&&e.error.stack)||""])});addEventListener("unhandledrejection",function(e){var q=window.__whybuddyEarlyErrors,r=e.reason;if(q.length<10)q.push(["unhandled_rejection",r&&r.message?r.message:String(r),(r&&r.stack)||""])});</script>
